server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # CV uploads are capped at 5 MB by the API; leave headroom for multipart overhead
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://api:3010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # LLM grading on submit can be slow
    }

    location = /health {
        proxy_pass http://api:3010;
    }

    # Listening audio and other static assets (Range requests work for audio seeking)
    location /audio/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
